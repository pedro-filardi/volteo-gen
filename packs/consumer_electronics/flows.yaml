# Which intercompany archetypes this industry uses (spec 7.2).

archetypes: [goods, services, loan]

flows:
  - key: GOODS_DE_ES
    type: goods
    seller: DE01
    buyer: ES01
    basis: std_cost_markup
    frequency: monthly
    accounts: {seller: revenue_ic, buyer: cogs_ic}
    unrealised_profit: true       # margin on unsold stock is eliminated
  - key: GOODS_DE_UK
    type: goods
    seller: DE01
    buyer: UK01
    basis: std_cost_markup
    frequency: monthly
    accounts: {seller: revenue_ic, buyer: cogs_ic}
    unrealised_profit: true
  - key: MGMT_FEE
    type: services
    seller: US01
    buyer: [DE01, ES01, UK01]
    basis: pct_of_revenue
    frequency: quarterly
    accounts: {seller: ic_service_income, buyer: ic_service_expense}
  - key: LOAN_US_UK
    type: loan
    lender: US01
    borrower: UK01
    principal: 2000000
    principal_ccy: GBP
    reference_rate: SONIA
    frequency: monthly
    accounts: {lender: ic_interest_income, borrower: ic_interest_expense}

ic_inventory:
  # Share of goods received that is still on hand at month end, by buyer.
  closing_stock_share: {ES01: 0.32, UK01: 0.28}

dividend:
  - {payer: ES01, receiver: US01, fy: 2025, amount_pct_of_prior_ni: 0.40}
