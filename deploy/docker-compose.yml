# Minimal serving stack: ClickHouse + Metabase.
#
#   docker compose up -d
#   ../seeds/../out/clickhouse/load.sh ../out/parquet --host 127.0.0.1
#   open http://localhost:3000
#
# Swap Metabase for Superset by uncommenting the block below; nothing else changes,
# because both point at the same views.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: volteo-clickhouse
    ports:
      - "8123:8123"     # HTTP — this is the port BI tools use
      - "9000:9000"     # native
    environment:
      CLICKHOUSE_DB: volteo
      CLICKHOUSE_USER: volteo
      CLICKHOUSE_PASSWORD: volteo
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Parquet is mounted read-only so you can load with clickhouse-local / file().
      - ../out/parquet:/var/lib/clickhouse/user_files/volteo:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  metabase:
    image: metabase/metabase:v0.50.21
    container_name: volteo-metabase
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_PLUGINS_DIR: /plugins
    volumes:
      # Metabase needs the ClickHouse driver dropped in; it is not bundled.
      # curl -L -o plugins/clickhouse.metabase-driver.jar \
      #   https://github.com/ClickHouse/metabase-clickhouse-driver/releases/latest/download/clickhouse.metabase-driver.jar
      - ./plugins:/plugins
      - metabase-data:/metabase.db

  # superset:
  #   image: apache/superset:4.0.2
  #   ports: ["8088:8088"]
  #   environment:
  #     SUPERSET_SECRET_KEY: change-me
  #   command: >
  #     bash -c "pip install clickhouse-connect &&
  #              superset db upgrade &&
  #              superset fab create-admin --username admin --firstname a --lastname b
  #                --email a@b.c --password admin &&
  #              superset init &&
  #              superset run -h 0.0.0.0 -p 8088"

volumes:
  clickhouse-data:
  metabase-data:
